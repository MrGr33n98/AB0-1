name: Deploy on VPS

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build and Push Backend Docker Image", "Build and Push Frontend Docker Image"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    env:
      # Conteúdo do docker-compose.yml, injetado como variável de ambiente
      DOCKER_COMPOSE_CONTENT: |
        services:
          db:
            image: postgres:14
            restart: always
            environment:
              POSTGRES_USER: ${POSTGRES_USER}
              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              POSTGRES_DB: ${POSTGRES_DB}
            volumes:
              - db_data:/var/lib/postgresql/data
            ports:
              - "5432:5432"
          backend:
            image: ghcr.io/MrGr33n98/ab0-1-backend:latest
            depends_on:
              - db
            environment:
              RAILS_ENV: production
              DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
              RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
              SECRET_KEY_BASE: ${SECRET_KEY_BASE}
              JWT_SECRET: ${JWT_SECRET}
              CORS_ORIGINS: ${CORS_ORIGINS}
            ports:
              - "3001:3001"
          frontend:
            image: ghcr.io/MrGr33n98/ab0-1-frontend:latest
            depends_on:
              - backend
            environment:
              NODE_ENV: production
              NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
              NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
            ports:
              - "3000:3000"
        volumes:
          db_data: {}
      # Variáveis de ambiente secretas e de contexto do GitHub
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Deploy Application
        run: |
          set -e
          
          echo "🚀 Iniciando deploy na VPS..."
          cd ~
          
          # Limpar e preparar o diretório de deploy
          # Verifica se o diretório existe e limpa o docker-compose antes de remover tudo
          if [ -d "ab0-app" ]; then
              cd ab0-app
              docker compose down --remove-orphans || true # Derruba containers existentes antes de remover
              cd ..
              rm -rf ab0-app
          fi
          
          mkdir -p ab0-app
          cd ab0-app
          
          # 🔍 Verificar e Instalar dependências
          echo "🔍 Verificando dependências..."
          
          # Verificar se o Docker está instalado
          if ! command -v docker &> /dev/null; then
            echo "❌ Erro: Docker não encontrado. Instale o Docker."
            exit 1
          fi
          
          # Verificar se o Docker está rodando
          if ! docker info > /dev/null 2>&1; then
            echo "❌ Erro: Docker não está rodando. Inicie o serviço Docker."
            exit 1
          fi
          
          # Verificar se o Docker Compose Plugin está instalado e instalar se não estiver
          if ! docker compose version &> /dev/null; then
            echo "📦 Instalando Docker Compose Plugin..."
            sudo apt update && sudo apt install -y docker-compose-plugin
          fi
          
          # Criar docker-compose.yml com valores de ambiente
          echo "📝 Criando docker-compose.yml..."
          echo "$DOCKER_COMPOSE_CONTENT" > docker-compose.yml
          
          # 🔐 Autenticar no GitHub Container Registry (GHCR)
          echo "🔐 Autenticando no GitHub Container Registry..."
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          
          # Função Simplificada e Robusta para verificar a existência de uma imagem no GHCR
          # Retorna 0 se a imagem existe e pode ser baixada, 1 caso contrário.
          check_ghcr_image_exists() {
            local image=$1
            echo "🔍 Verificando existência da imagem: $image"
            
            # Tenta fazer pull da imagem com timeout de 60s
            # O tempo limite (timeout) garante que o comando não fique bloqueado indefinidamente
            # caso o GHCR esteja temporariamente indisponível ou lento.
            if timeout 60s docker pull "$image" > /dev/null 2>&1; then
              echo "✅ Imagem $image existe e foi baixada"
              docker rmi "$image" > /dev/null 2>&1 || true # Remove a imagem após o teste
              return 0
            else
              echo "❌ Imagem $image NÃO existe ou não pôde ser baixada do GHCR."
              return 1
            fi
          }
          
          # ⏳ Aguardar disponibilidade das imagens customizadas (GHCR)
          MAX_ATTEMPTS=10
          WAIT_TIME=15 # Tempo de espera entre as tentativas
          
          echo "⏳ Aguardando disponibilidade das imagens customizadas no GHCR..."
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            backend_ready=0
            frontend_ready=0
            
            # Apenas checamos as imagens customizadas que construímos e enviamos
              if check_ghcr_image_exists "ghcr.io/MrGr33n98/ab0-1-backend:latest"; then
                backend_ready=1
              fi
              
              if check_ghcr_image_exists "ghcr.io/MrGr33n98/ab0-1-frontend:latest"; then
                frontend_ready=1
              fi
            
            if [ $backend_ready -eq 1 ] && [ $frontend_ready -eq 1 ]; then
              echo "✅ Todas as imagens customizadas estão disponíveis no GHCR."
              break
            else
              echo "⏳ Tentativa $attempt/$MAX_ATTEMPTS - Aguardando mais $WAIT_TIME segundos..."
              sleep $WAIT_TIME
            fi
          done
          
          # Falha se as imagens customizadas não estiverem prontas após todas as tentativas
          if [ $backend_ready -eq 0 ] || [ $frontend_ready -eq 0 ]; then
            echo "❌ Falha crítica: Imagens customizadas não disponíveis no GHCR após $MAX_ATTEMPTS tentativas."
            exit 1
          fi
          
          # --- 🐳 Iniciar o Deploy Docker Compose ---
          echo "🐳 Iniciando deploy com Docker Compose..."
          
          # Realizar pull das imagens (incluindo postgres:14 e as do GHCR)
          # Aumentei o timeout para pull, pois pode demorar
          timeout 180s docker compose pull || { echo "⚠️ Erro ou timeout ao fazer pull das imagens."; exit 1; }
          
          # Derrubar e remover containers, redes e volumes órfãos
          timeout 90s docker compose down --remove-orphans || { echo "⚠️ Erro ou timeout ao derrubar containers antigos."; exit 1; }
          
          # Subir os novos containers em background
          # Use --build se quiser reconstruir imagens localmente antes de subir (normalmente não para deploy)
          timeout 180s docker compose up -d || { echo "❌ Erro ou timeout ao subir os containers."; exit 1; }
          
          # 🏃‍♀️ Rodar migrações do banco de dados (crucial para aplicações Rails)
          echo "✨ Rodando migrações do banco de dados para o Backend..."
          # Espera um pouco antes das migrações para o DB ter tempo de subir
          sleep 15
          docker compose run --rm backend bundle exec rails db:migrate || { echo "❌ Erro ao rodar migrações do Backend."; docker compose logs db backend; exit 1; }
          
          # Opcional: Rodar seeds do banco de dados
          # echo "🌱 Rodando seeds do banco de dados (opcional)..."
          # docker compose run --rm backend bundle exec rails db:seed || echo "⚠️ Aviso: Erro ao rodar seeds ou seeds não existiam."
          
          echo "⏳ Aguardando inicialização e saúde dos serviços..."
          
          # Função para verificar a saúde do serviço HTTP
          check_service_health() {
            local service_name=$1
            local url=$2
            local max_attempts=20 # Aumentado para dar mais tempo ao Rails
            local wait_time=10 # Espera entre tentativas
            local curl_timeout=10 # Timeout para cada requisição curl
          
            echo "🔍 Verificando saúde do serviço '$service_name' em $url..."
            for ((i=1; i<=$max_attempts; i++)); do
              # Curl com flags para silenciar saída (-s), falhar em erros HTTP (-f), e timeout
              if curl -s -f --max-time "$curl_timeout" "$url" > /dev/null; then
                echo "✅ Serviço '$service_name' está respondendo com sucesso."
                return 0
              fi
              echo "⏳ Tentativa $i/$max_attempts - Aguardando $wait_time segundos para '$service_name'..."
              sleep $wait_time
            done
          
            echo "❌ Serviço '$service_name' NÃO respondeu após $max_attempts tentativas."
            echo "--- Logs do serviço '$service_name' ---"
            docker compose logs "$service_name" || echo "Não foi possível recuperar logs para '$service_name'."
            return 1
          }
          
          # 💖 Verificar saúde dos serviços principais
          check_service_health "backend" "http://localhost:3001/health"
          check_service_health "frontend" "http://localhost:3000"
          
          echo "✅ Deploy finalizado com sucesso!"
          echo "🌐 Serviços deverão estar disponíveis em:"
          echo "   Frontend: http://localhost:3000 (na VPS)"
          echo "   Backend: http://localhost:3001 (na VPS)"