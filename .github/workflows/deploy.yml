name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - master-frontend

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Login GHCR com GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build & Push Images
      - name: Build & Push Images
        run: |
          chmod +x ./script/fix-registry-names.sh
          ./script/fix-registry-names.sh

      # Deploy na VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          script_stop: true
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_HOST,DATABASE_URL,RAILS_MASTER_KEY,SECRET_KEY_BASE,JWT_SECRET,CORS_ORIGINS,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_SITE_URL
          script: |
            set -e
            echo "🚀 Iniciando deploy na VPS..."

            mkdir -p ~/ab0-app
            cd ~/ab0-app

            echo "📦 Criando docker-compose.yml..."
            cat > docker-compose.yml <<'EOF'
            version: "3.9"
            services:
              db:
                image: postgres:14
                restart: always
                environment:
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                  POSTGRES_DB: ${POSTGRES_DB}
                volumes:
                  - db_data:/var/lib/postgresql/data
                ports:
                  - "5432:5432"

              backend:
                image: ghcr.io/felipemorais/ab0-1-backend:latest
                depends_on:
                  - db
                environment:
                  RAILS_ENV: production
                  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
                  RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
                  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
                  JWT_SECRET: ${JWT_SECRET}
                  POSTGRES_HOST: db
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                  POSTGRES_DB: ${POSTGRES_DB}
                  CORS_ORIGINS: ${CORS_ORIGINS}
                ports:
                  - "3001:3001"

              frontend:
                image: ghcr.io/felipemorais/ab0-frontend:latest
                depends_on:
                  - backend
                environment:
                  NODE_ENV: production
                  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
                  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
                ports:
                  - "3000:3000"

            volumes:
              db_data:
            EOF

            echo "📝 Criando arquivo .env..."
            cat > .env <<EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_HOST=${POSTGRES_HOST}
            DATABASE_URL=${DATABASE_URL}
            RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
            SECRET_KEY_BASE=${SECRET_KEY_BASE}
            JWT_SECRET=${JWT_SECRET}
            CORS_ORIGINS=${CORS_ORIGINS}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
            EOF

            echo "🐳 Atualizando containers..."
            docker compose pull
            docker compose down
            docker compose up -d --remove-orphans
            docker image prune -af

            echo "✅ Deploy finalizado com sucesso!"
