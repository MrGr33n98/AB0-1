name: Deploy on VPS
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build and Push Backend Docker Image", "Build and Push Frontend Docker Image"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    env:
      DOCKER_COMPOSE_CONTENT: |
        services:
          db:
            image: postgres:14
            restart: always
            environment:
              POSTGRES_USER: ${POSTGRES_USER}
              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              POSTGRES_DB: ${POSTGRES_DB}
            volumes:
              - db_data:/var/lib/postgresql/data
            ports:
              - "5432:5432"
          backend:
            image: ghcr.io/felipemorais/ab0-1-backend:latest
            depends_on:
              - db
            environment:
              RAILS_ENV: production
              DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
              RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
              SECRET_KEY_BASE: ${SECRET_KEY_BASE}
              JWT_SECRET: ${JWT_SECRET}
              CORS_ORIGINS: ${CORS_ORIGINS}
            ports:
              - "3001:3001"
          frontend:
            image: ghcr.io/felipemorais/ab0-1-frontend:latest
            depends_on:
              - backend
            environment:
              NODE_ENV: production
              NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
              NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
            ports:
              - "3000:3000"
        volumes:
          db_data: {}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          envs: DOCKER_COMPOSE_CONTENT,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,RAILS_MASTER_KEY,SECRET_KEY_BASE,JWT_SECRET,CORS_ORIGINS,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_SITE_URL,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            
            echo "🚀 Iniciando deploy na VPS..."
            cd ~
            rm -rf ab0-app
            mkdir -p ab0-app
            cd ab0-app
            
            # Verificar dependências necessárias
            echo "🔍 Verificando dependências..."
            
            # Verificar se o Docker está rodando
            if ! docker info > /dev/null 2>&1; then
              echo "❌ Erro: Docker não está rodando"
              exit 1
            fi
            
            # Verificar se o Docker Compose Plugin está instalado
            if ! docker compose version > /dev/null 2>&1; then
              echo "📦 Instalando Docker Compose Plugin..."
              apt update && apt install -y docker-compose-plugin
            fi
            
            # Criar docker-compose.yml com valores de ambiente
            echo "$DOCKER_COMPOSE_CONTENT" > docker-compose.yml
            
            # Autenticar no GHCR
            echo "🔐 Autenticando no GitHub Container Registry..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            # Função para verificar existência de imagem
            check_image_exists() {
              local image=$1
              echo "🔍 Verificando existência da imagem: $image"
              
              # Tenta fazer pull da imagem e verifica o resultado
              # O timeout é necessário para evitar que o pull fique travado caso a imagem não exista
              if timeout 30s docker pull "$image" > /dev/null 2>&1; then
                echo "✅ Imagem $image existe e foi baixada"
                # Remover a imagem após o teste para economizar espaço
                docker rmi "$image" > /dev/null 2>&1 || true
                return 0
              else
                echo "❌ Imagem $image NÃO existe ou não pôde ser baixada"
                return 1
              fi
            }
            
            # Verificar se as imagens existem antes de prosseguir
            MAX_ATTEMPTS=10
            WAIT_TIME=30
            
            echo "⏳ Aguardando disponibilidade das imagens..."
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              backend_exists=0
              frontend_exists=0
              db_exists=0
              
              if check_image_exists "ghcr.io/felipemorais/ab0-1-backend:latest"; then
                backend_exists=1
              fi
              
              if check_image_exists "ghcr.io/felipemorais/ab0-1-frontend:latest"; then
                frontend_exists=1
              fi
              
              if check_image_exists "postgres:14"; then
                db_exists=1
              fi
              
              # Se todas as imagens necessárias existirem, podemos continuar
              if [ $backend_exists -eq 1 ] && [ $frontend_exists -eq 1 ] && [ $db_exists -eq 1 ]; then
                echo "✅ Todas as imagens estão disponíveis"
                break
              else
                echo "⏳ Tentativa $attempt/$MAX_ATTEMPTS - Aguardando mais $WAIT_TIME segundos..."
                sleep $WAIT_TIME
              fi
            done
            
            # Se após todas as tentativas as imagens ainda não estiverem disponíveis, falha
            if [ $backend_exists -eq 0 ] || [ $frontend_exists -eq 0 ]; then
              echo "❌ Algumas imagens não estão disponíveis após $MAX_ATTEMPTS tentativas"
              echo "❌ Backend disponível: $backend_exists"
              echo "❌ Frontend disponível: $frontend_exists"
              exit 1
            fi
            
            # Atualizar e iniciar os containers
            echo "🐳 Atualizando containers..."
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
            
            echo "⏳ Aguardando inicialização dos serviços..."
            
            # Função para verificar a saúde do serviço
            check_service() {
              local service=$1
              local url=$2
              local max_attempts=10
              local wait_time=15
              
              echo "🔍 Verificando $service..."
              for ((i=1; i<=$max_attempts; i++)); do
                if curl -f "$url" > /dev/null 2>&1; then
                  echo "✅ $service está respondendo"
                  return 0
                fi
                echo "⏳ Tentativa $i/$max_attempts - Aguardando $wait_time segundos..."
                sleep $wait_time
              done
              
              echo "⚠️ $service não está respondendo após todas as tentativas"
              docker compose logs $service
              return 1
            }
            
            # Verificar serviços
            check_service "Backend" "http://localhost:3001/health"
            check_service "Frontend" "http://localhost:3000"
            
            echo "✅ Deploy finalizado!"
            echo "🌐 Serviços disponíveis em:"
            echo "   Frontend: http://localhost:3000"
            echo "   Backend: http://localhost:3001"