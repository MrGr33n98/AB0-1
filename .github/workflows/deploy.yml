name: Deploy on VPS

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build and Push Backend Docker Image", "Build and Push Frontend Docker Image"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}

    env:
      DOCKER_COMPOSE_CONTENT: |
        services:
          db:
            image: postgres:14
            restart: always
            environment:
              POSTGRES_USER: ${POSTGRES_USER}
              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              POSTGRES_DB: ${POSTGRES_DB}
            volumes:
              - db_data:/var/lib/postgresql/data
            ports:
              - "5432:5432"
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
              interval: 5s
              retries: 10

          backend:
            image: ghcr.io/mrgr33n98/ab0-1-backend:latest
            depends_on:
              db:
                condition: service_healthy
            environment:
              RAILS_ENV: production
              DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
              RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
              SECRET_KEY_BASE: ${SECRET_KEY_BASE}
              JWT_SECRET: ${JWT_SECRET}
              CORS_ORIGINS: ${CORS_ORIGINS}
            ports:
              - "3001:3001"

          frontend:
            image: ghcr.io/mrgr33n98/ab0-1-frontend:latest
            depends_on:
              - backend
            environment:
              NODE_ENV: production
              NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
              NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
            ports:
              - "3000:3000"

        volumes:
          db_data: {}

      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      # GHCR_PAT and GITHUB_ACTOR are removed from env as they are passed directly to the login action
      # GHCR_PAT: ${{ secrets.GHCR_PAT }}
      # GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Deploy Application
        run: |
          set -e
          echo "🚀 Iniciando deploy na VPS..."
          cd ~/ab0-app || mkdir -p ~/ab0-app && cd ~/ab0-app

          # Verificar dependências
          echo "🔍 Verificando dependências..."
          if ! command -v docker &> /dev/null; then
            echo "❌ Erro: Docker não encontrado."
            exit 1
          fi

          if ! docker info > /dev/null 2>&1; then
            echo "❌ Erro: Docker não está rodando."
            exit 1
          fi

          if ! docker compose version &> /dev/null; then
            echo "📦 Instalando Docker Compose Plugin..."
            sudo apt update && sudo apt install -y docker-compose-plugin
          fi

          # Criar/atualizar docker-compose.yml
          echo "📝 Criando docker-compose.yml..."
          echo "$DOCKER_COMPOSE_CONTENT" > docker-compose.yml

          # The manual docker login command is removed, as the dedicated action handles it
          # echo "🔐 Autenticando no GitHub Container Registry..."
          # echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # Pull e subir containers
          echo "🐳 Atualizando containers..."
          timeout 180s docker compose pull
          timeout 90s docker compose down --remove-orphans
          timeout 180s docker compose up -d

          # Migrações Rails
          echo "✨ Rodando migrações..."
          docker compose run --rm backend bundle exec rails db:migrate || {
            echo "❌ Erro ao rodar migrações"
            docker compose logs db backend
            exit 1
          }

          echo "✅ Deploy finalizado com sucesso!"
          echo "🌐 Frontend: http://<SEU_IP_OU_DOMINIO>:3000"
          echo "🌐 Backend: http://<SEU_IP_OU_DOMINIO>:3001"
