name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ab0_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true
          
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          
      - name: Setup database
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ab0_test
          REDIS_URL: redis://localhost:6379/0
          
      - name: Run tests with coverage
        run: |
          bundle exec rspec --format progress --format json --out rspec_results.json
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ab0_test
          REDIS_URL: redis://localhost:6379/0
          COVERAGE: true
          
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./AB0-1-back/coverage/
          retention-days: 30
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./AB0-1-back/rspec_results.json
          retention-days: 30

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-front
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: "./AB0-1-front/package-lock.json"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run type check
        run: npm run type-check || echo "⚠️ Type check failed but continuing..."
        
      - name: Run tests with coverage
        run: npm run test:ci || echo "⚠️ No tests found or tests failed"
        
      - name: Build application
        run: npm run build
        
      - name: Lint code
        run: npm run lint
        
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ./AB0-1-front/coverage/
          retention-days: 30
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./AB0-1-front/.next/
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./AB0-1-back
          push: false
          load: true
          tags: ab0-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./AB0-1-front
          push: false
          load: true
          tags: ab0-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Run integration tests
        run: |
          docker compose -f docker-compose.test.yml up -d
          sleep 30
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs
          docker compose -f docker-compose.test.yml down
        working-directory: ./
        continue-on-error: true
